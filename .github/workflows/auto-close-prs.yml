name: Auto-close pull requests
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr close "$PR" --repo "$REPO" --comment "Thanks for your interest! This repository holds The Workbench blog's assets and change history and does not accept pull requests. If you spotted a problem with the blog, the comments on the relevant post are the right place."
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
